<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base Diamond / Hexagon -->
  <rect x="15" y="15" width="70" height="70" rx="20" transform="rotate(45 50 50)" fill="url(#grad1)" filter="url(#glow)"/>
  <!-- Central Neural Node -->
  <circle cx="50" cy="50" r="14" fill="#0f172a" />
  <circle cx="50" cy="50" r="8" fill="#38bdf8" />
  <!-- Connecting Synapses -->
  <line x1="50" y1="20" x2="50" y2="36" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="64" x2="50" y2="80" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="50" x2="36" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="50" x2="80" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>

